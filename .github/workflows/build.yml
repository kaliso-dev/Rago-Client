name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Check analyse.py parses
        run: python3 -m py_compile bench/analyse.py
      - uses: actions/upload-artifact@v4
        with:
          name: rago-jar
          path: build/libs/*.jar
          if-no-files-found: error
