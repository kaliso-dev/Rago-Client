name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Check analyse.py parses
        run: python3 -m py_compile bench/analyse.py
      - uses: actions/upload-artifact@v4
        with:
          name: rago-jar
          path: build/libs/*.jar
          if-no-files-found: error

  launcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Test the launcher engine
        run: cargo test --locked -p rago-launcher-core

  launcher-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher/app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Windows installer
        env:
          # Rago's Azure app id (public, not a secret); sign-in stays off while it is empty
          RAGO_MS_CLIENT_ID: ${{ vars.RAGO_MS_CLIENT_ID }}
        run: npx --yes @tauri-apps/cli@2.12.4 build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: rago-launcher-windows
          path: launcher/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  launcher-windows-game:
    # installs everything through the launcher's engine on a real Windows machine and starts the
    # game with a test profile until Forge has run Rago (no account, nothing online)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - uses: actions/download-artifact@v4
        with:
          name: rago-jar
          path: rago-jar
      - name: Install and start the game
        shell: bash
        run: |
          jar=$(ls rago-jar | grep -- '+1.8.9.jar$' | head -1)
          cd launcher
          RAGO_E2E_DIR="$RUNNER_TEMP\\rago" RAGO_E2E_JAR="$GITHUB_WORKSPACE\\rago-jar\\$jar" \
            cargo test --locked -p rago-launcher-core --test end_to_end -- --ignored --nocapture
