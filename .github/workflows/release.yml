name: release

# A tag publishes a GitHub release that the launcher downloads:
#   v1.11.0          -> rago-1.11.0+1.8.9.jar (the version must match mod_version)
#   launcher-v0.2.0  -> the launcher's Windows installer (the version must match launcher/app/tauri.conf.json)
# GitHub publishes each asset's SHA-256, which the launcher checks before using it.
on:
  push:
    tags: ["v*", "launcher-v*"]

permissions:
  contents: write

jobs:
  rago:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but mod_version=$version"; exit 1; }
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/rago-*+1.8.9.jar | grep -v -- '-sources' | head -1)
          gh release create "$GITHUB_REF_NAME" "$jar" --title "Rago $GITHUB_REF_NAME" --generate-notes

  loader:
    if: startsWith(github.ref_name, 'launcher-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Rago's loader (put inside the launcher)
        run: bash loader/ci/build.sh "$RUNNER_TEMP/game"
      - uses: actions/upload-artifact@v4
        with:
          name: rago-loader-jar
          path: loader/build/libs/rago-loader-*.jar
          if-no-files-found: error

  launcher:
    if: startsWith(github.ref_name, 'launcher-v')
    needs: loader
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: launcher/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rago-loader-jar
          path: rago-loader-jar
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches the launcher version
        run: |
          version=$(node -p "require('./tauri.conf.json').version")
          test "launcher-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but version $version"; exit 1; }
      - name: Build the installer
        env:
          RAGO_MS_CLIENT_ID: ${{ vars.RAGO_MS_CLIENT_ID }}
        run: |
          export RAGO_LOADER_JAR="$GITHUB_WORKSPACE\\rago-loader-jar\\$(ls ../../rago-loader-jar | head -1)"
          npx --yes @tauri-apps/cli@2.12.4 build --ci
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ../target/release/bundle/nsis/*.exe --title "Rago launcher ${GITHUB_REF_NAME#launcher-v}" --generate-notes --latest=false
