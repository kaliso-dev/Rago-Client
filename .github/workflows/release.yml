name: release

# Publishes what the launcher downloads and updates by itself:
#   v1.11.2          -> rago-1.11.2+1.8.9.jar (the version is mod_version in gradle.properties)
#   launcher-v0.3.0  -> the launcher's Windows installer (the version is in launcher/app/tauri.conf.json)
#
# Two ways to publish:
#   - Actions -> release -> Run workflow: publishes each of the two versions that has no release
#     yet and creates its tag, so bumping a version and pressing the button is the whole release.
#   - Pushing one of those tags: publishes that one only (the tag must match the version).
#
# GitHub publishes each asset's SHA-256, which the launcher checks before using it. The mod's
# release is marked "latest" (the launcher asks GitHub for it); launcher releases never are.
on:
  push:
    tags: ["v*", "launcher-v*"]
  workflow_dispatch:
    inputs:
      patcher:
        description: "Bundle PolyPatcher (CC BY-NC-SA: only for a Rago that sells nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mod: ${{ steps.plan.outputs.mod }}
      launcher: ${{ steps.plan.outputs.launcher }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mod="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          launcher="launcher-v$(node -p "require('./launcher/app/tauri.conf.json').version")"
          echo "mod $mod, launcher $launcher"
          # the launcher compares its own Cargo version with the release's: both must agree
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' launcher/Cargo.toml)
          test "launcher-v$cargo" = "$launcher" || { echo "::error::launcher/Cargo.toml says $cargo but tauri.conf.json says ${launcher#launcher-v}"; exit 1; }
          released() {
            # 0 when the release exists, 1 when GitHub says it does not; anything else stops here
            out=$(gh release view "$1" --json tagName 2>&1) && return 0
            case "$out" in *"release not found"*) return 1 ;; esac
            echo "$out"; exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF_NAME" in
              "$mod") echo "mod=$mod" >> "$GITHUB_OUTPUT" ;;
              "$launcher") echo "launcher=$launcher" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::tag $GITHUB_REF_NAME matches neither $mod nor $launcher"; exit 1 ;;
            esac
          else
            released "$mod" && echo "::notice::Rago $mod is already released: bump mod_version to publish the mod again" || echo "mod=$mod" >> "$GITHUB_OUTPUT"
            released "$launcher" && echo "::notice::$launcher is already released: bump the version in tauri.conf.json to publish the launcher again" || echo "launcher=$launcher" >> "$GITHUB_OUTPUT"
          fi

  rago:
    needs: plan
    if: needs.plan.outputs.mod != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        env:
          PATCHER: ${{ inputs.patcher }}
        run: |
          if [ "$PATCHER" = true ]; then ./gradlew build --no-daemon; else ./gradlew build --no-daemon -PnoPatcher; fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.mod }}
        run: |
          jar=$(ls build/libs/rago-*+1.8.9.jar | grep -v -- '-sources' | head -1)
          test -n "$jar" || { echo "::error::no Rago jar was built"; exit 1; }
          gh release create "$TAG" "$jar" --target "$GITHUB_SHA" --title "Rago ${TAG#v}" --generate-notes --latest

  loader:
    needs: plan
    if: needs.plan.outputs.launcher != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Rago's loader (put inside the launcher)
        run: bash loader/ci/build.sh "$RUNNER_TEMP/game"
      - uses: actions/upload-artifact@v4
        with:
          name: rago-loader-jar
          path: loader/build/libs/rago-loader-*.jar
          if-no-files-found: error

  launcher:
    needs: [plan, loader, rago]
    # waits for the mod's release when both are published, so the mod stays the "latest" one
    if: always() && needs.plan.outputs.launcher != '' && needs.loader.result == 'success' && needs.rago.result != 'failure'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: launcher/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rago-loader-jar
          path: rago-loader-jar
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the launcher engine
        working-directory: launcher
        run: cargo test --locked -p rago-launcher-core
      - name: Build the installer
        env:
          RAGO_MS_CLIENT_ID: ${{ vars.RAGO_MS_CLIENT_ID }}
        run: |
          export RAGO_LOADER_JAR="$GITHUB_WORKSPACE\\rago-loader-jar\\$(ls ../../rago-loader-jar | head -1)"
          npx --yes @tauri-apps/cli@2.12.4 build --ci
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.launcher }}
        run: |
          gh release create "$TAG" ../target/release/bundle/nsis/*-setup.exe --target "$GITHUB_SHA" \
            --title "Rago launcher ${TAG#launcher-v}" --generate-notes --latest=false
